# Puerto personalizado: 81 + NN
server.port=8168

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de LangChain4j
langchain4j.open-ai.chat-model.api-key=demo
langchain4j.open-ai.chat-model.model-name=gpt-4o-mini
langchain4j.open-ai.chat-model.timeout=30s
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

logging.level.dev.langchain4j=DEBUG

# Conexion al PostgreSQL del compose
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/agrosmart_db
spring.datasource.username=agrosmart
spring.datasource.password=agrosmart
spring.datasource.driver-class-name=org.postgresql.Driver

# Se usa el compose de forma manual para conservar la conexion JDBC del perfil
spring.docker.compose.enabled=false